<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello — Great Site</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="A simple, elegant hello landing page." />
</head>
<body>
  <main class="hero">
    <div class="card">
      <img class="avatar" alt="avatar" src="https://avatars.githubusercontent.com/u/10612691?v=4">
      <h1 id="greeting">Hello, <span id="type">world</span></h1>
      <p class="tag">Welcome to a small, fast, and beautiful hello page — built with HTML, CSS and a little JavaScript.</p>
      <div class="controls">
        <button id="themeToggle" aria-pressed="false">Toggle theme</button>
        <a class="cta" href="#" id="confettiBtn">Celebrate ✨</a>
      </div>
    </div>
    <div class="footer">Made with ♥ — Open this repo on GitHub</div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
